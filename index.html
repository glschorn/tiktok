<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TikTok Viewer">
<meta name="theme-color" content="#0b0b0f">
<title>TikTok Viewer</title>
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%230b0b0f'/><path d='M100 40v70a18 18 0 1 1-18-18' fill='none' stroke='%2325f4ee' stroke-width='14' stroke-linecap='round'/><path d='M106 46v70a18 18 0 1 1-18-18' fill='none' stroke='%23fe2c55' stroke-width='14' stroke-linecap='round'/></svg>">
<style>
  /* Layout: one player fills the screen; a swipe strip on the right edge switches videos */
  :root {
    --bg: #0b0b0f;
    --fg: #f4f4f6;
    --muted: #8a8a96;
    --panel: #16161d;
    --line: #2a2a34;
    --accent: #fe2c55;
    --accent-2: #25f4ee;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    --strip: 64px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; overscroll-behavior: none; }

  #stage { position: fixed; inset: 0; background: #000; }
  #player { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }

  /* Right strip: swipe up/down here. The rest of the screen belongs to the player. */
  #strip {
    position: absolute; top: 0; bottom: 0; right: 0; width: calc(var(--strip) + env(safe-area-inset-right));
    z-index: 3; touch-action: none;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px;
    padding-right: env(safe-area-inset-right);
    background: linear-gradient(to left, rgba(0,0,0,.35), transparent);
  }
  #strip .hint { position: absolute; bottom: calc(96px + env(safe-area-inset-bottom)); font-size: 10px; color: rgba(255,255,255,.55); writing-mode: vertical-rl; letter-spacing: .08em; }

  .meta {
    position: absolute; left: 0; right: var(--strip); bottom: 0; z-index: 2;
    padding: 10px 8px calc(14px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: linear-gradient(transparent, rgba(0,0,0,.6));
    pointer-events: none;
  }
  .meta span { font-size: 13px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.8); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta a { pointer-events: auto; text-decoration: none; }

  .empty {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 0 32px; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.5;
  }
  .empty .logo { width: 72px; height: 72px; }
  .empty b { color: var(--fg); font-size: 20px; }

  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    padding: calc(8px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
    display: flex; justify-content: space-between; align-items: center; pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }
  .counter { font-size: 13px; font-variant-numeric: tabular-nums; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.8); }

  .btn {
    appearance: none; border: 0; border-radius: 999px;
    background: rgba(22,22,29,.75); color: #fff;
    font: 600 14px/1 var(--font); padding: 10px 14px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    cursor: pointer; user-select: none;
  }
  .btn.primary { background: var(--accent); }
  .btn.icon { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; font-size: 20px; }
  .btn:disabled { opacity: .35; }
  .btn:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--panel); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0;
    padding: 14px max(16px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    transform: translateY(110%); transition: transform .25s ease;
    display: flex; flex-direction: column; gap: 10px;
  }
  .sheet.open { transform: translateY(0); }
  .sheet h2 { margin: 0; font-size: 16px; }
  .sheet p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
  .row { display: flex; gap: 8px; }
  .row input {
    flex: 1; min-width: 0; font: 16px var(--font); padding: 11px 12px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  .row input:focus { outline: 2px solid var(--accent-2); border-color: transparent; }
  .err { color: var(--accent); font-size: 13px; min-height: 1em; }
  .list { max-height: 34vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--bg); font-size: 13px; }
  .item.active { outline: 1px solid var(--accent-2); }
  .item span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); cursor: pointer; }
  .item button { background: none; border: 0; color: var(--accent); font-size: 18px; cursor: pointer; padding: 4px; }

  .backdrop { position: fixed; inset: 0; z-index: 9; background: rgba(0,0,0,.5); display: none; }
  .backdrop.open { display: block; }

  @media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
</style>
</head>
<body>

<div class="topbar">
  <span class="counter" id="counter"></span>
  <button class="btn icon" id="openSheet" aria-label="Додати відео">＋</button>
</div>

<div id="stage">
  <iframe id="player" title="TikTok" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
  <div class="meta" id="meta"></div>
  <div id="strip">
    <button class="btn icon" id="prev" aria-label="Попереднє">▲</button>
    <button class="btn icon" id="next" aria-label="Наступне">▼</button>
    <span class="hint">свайп тут</span>
  </div>
  <div class="empty" id="empty" hidden>
    <svg class="logo" viewBox="0 0 180 180"><rect width="180" height="180" rx="40" fill="#16161d"/><path d="M100 40v70a18 18 0 1 1-18-18" fill="none" stroke="#25f4ee" stroke-width="14" stroke-linecap="round"/><path d="M106 46v70a18 18 0 1 1-18-18" fill="none" stroke="#fe2c55" stroke-width="14" stroke-linecap="round"/></svg>
    <b>Поки порожньо</b>
    <div>Натисніть ＋ і вставте посилання на відео TikTok.<br>Перемикайте відео свайпом по правому краю або кнопками.</div>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <h2>Додати відео</h2>
  <p>Вставте посилання виду tiktok.com/@user/video/… Список зберігається на цьому пристрої.</p>
  <div class="row">
    <input id="url" type="url" inputmode="url" placeholder="https://www.tiktok.com/@…/video/…" autocomplete="off">
    <button class="btn primary" id="add">Додати</button>
  </div>
  <div class="err" id="err"></div>
  <div class="list" id="list"></div>
  <button class="btn" id="closeSheet">Закрити</button>
</div>

<script>
(function () {
  const KEY = 'tiktok-viewer.videos';
  const $ = id => document.getElementById(id);
  const player = $('player'), meta = $('meta'), empty = $('empty'), strip = $('strip');
  const prevBtn = $('prev'), nextBtn = $('next'), counter = $('counter');
  const sheet = $('sheet'), backdrop = $('backdrop'), urlInput = $('url'), err = $('err'), list = $('list');

  let videos = load();
  let idx = 0;
  let loadedId = null;

  function load() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(videos)); } catch {} }

  function parse(raw) {
    const s = raw.trim();
    if (/^\d{15,22}$/.test(s)) return { id: s, user: '' };
    const m = s.match(/tiktok\.com\/(?:@([\w.\-]+)\/)?(?:video|photo|v)\/(\d{15,22})/i);
    if (m) return { id: m[2], user: m[1] || '' };
    if (/vm\.tiktok\.com|vt\.tiktok\.com|\/t\//i.test(s)) {
      throw new Error('Короткі посилання (vm.tiktok.com) не підтримуються — відкрийте його в браузері та скопіюйте повну адресу.');
    }
    throw new Error('Не схоже на посилання TikTok.');
  }

  // Exactly one player exists, and it is reloaded only when the video actually changes —
  // this keeps the request rate low enough to avoid TikTok's overload protection.
  function show(i) {
    if (!videos.length) {
      empty.hidden = false; strip.hidden = true; meta.innerHTML = ''; counter.textContent = '';
      if (loadedId) { player.src = 'about:blank'; loadedId = null; }
      return;
    }
    empty.hidden = true; strip.hidden = false;
    idx = Math.max(0, Math.min(videos.length - 1, i));
    const v = videos[idx];
    if (loadedId !== v.id) {
      player.src = `https://www.tiktok.com/embed/v2/${v.id}?lang=uk&autoplay=1`;
      loadedId = v.id;
    }
    meta.innerHTML = `<span>${v.user ? '@' + v.user : v.id}</span>
      <a class="btn" href="https://www.tiktok.com/@${v.user || 'tiktok'}/video/${v.id}" target="_blank" rel="noopener">Відкрити</a>`;
    counter.textContent = `${idx + 1} / ${videos.length}`;
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === videos.length - 1;
  }
  const go = d => show(idx + d);

  prevBtn.addEventListener('click', () => go(-1));
  nextBtn.addEventListener('click', () => go(1));

  // Swipe on the right strip (touch and mouse). Buttons inside the strip still get their clicks.
  let startY = null, startT = 0;
  strip.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    startY = e.clientY; startT = Date.now();
    try { strip.setPointerCapture(e.pointerId); } catch {}
  });
  strip.addEventListener('pointerup', e => {
    if (startY === null) return;
    const dy = e.clientY - startY, dt = Date.now() - startT;
    startY = null;
    if (Math.abs(dy) > 40 || (Math.abs(dy) > 15 && dt < 250)) go(dy < 0 ? 1 : -1);
  });
  strip.addEventListener('pointercancel', () => { startY = null; });
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') go(1);
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') go(-1);
  });

  function renderList() {
    list.innerHTML = '';
    videos.forEach((v, i) => {
      const row = document.createElement('div');
      row.className = 'item' + (i === idx ? ' active' : '');
      row.innerHTML = `<span>${i + 1}. ${v.user ? '@' + v.user + ' · ' : ''}${v.id}</span><button aria-label="Видалити">✕</button>`;
      row.querySelector('span').onclick = () => { show(i); closeSheet(); };
      row.querySelector('button').onclick = () => {
        videos.splice(i, 1); save();
        show(Math.min(idx, videos.length - 1)); renderList();
      };
      list.appendChild(row);
    });
  }

  function openSheet() { renderList(); sheet.classList.add('open'); backdrop.classList.add('open'); setTimeout(() => urlInput.focus(), 250); }
  function closeSheet() { sheet.classList.remove('open'); backdrop.classList.remove('open'); err.textContent = ''; }

  function add() {
    try {
      const v = parse(urlInput.value);
      if (videos.some(x => x.id === v.id)) throw new Error('Це відео вже у списку.');
      videos.unshift(v); save();
      urlInput.value = ''; err.textContent = '';
      show(0); renderList();
    } catch (e) { err.textContent = e.message; }
  }

  $('openSheet').onclick = openSheet;
  $('closeSheet').onclick = closeSheet;
  backdrop.onclick = closeSheet;
  $('add').onclick = add;
  urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });

  const q = new URLSearchParams(location.search).get('add');
  if (q) { urlInput.value = q; add(); history.replaceState(null, '', location.pathname); }

  show(0);
})();
</script>
</body>
</html>
